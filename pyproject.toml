[project]
name = "python-generics"
description = "A package to determine the values of generic classes through instances or subclasses "
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info@hochfrequenz.de" }]
keywords = ["python", "generics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/python-generics/releases"
Homepage = "https://github.com/Hochfrequenz/python-generics"

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.per-file-target-version]
"unittests/test_py_312.py" = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
    "PLR0917", # too-many-positional-arguments
    "PLR2004", # magic-value-comparison
]

[tool.ruff.lint.per-file-ignores]
# unittests/.pylintrc disabled invalid-name repo-wide for this directory: tests use single
# uppercase letters (A, B, C, ...) as class/type-alias names to mirror TypeVar conventions.
"unittests/*" = ["N"]

[tool.ruff.format]

[tool.codespell]
skip = "uv.lock"

[dependency-groups]
tests = [
    "pydantic==2.13.4",
    "pytest==9.1.1"
]
coverage = [
    "coverage==7.15.2",
    {include-group = "tests"}
]
linting = [
    "ruff==0.16.0",
    {include-group = "tests"}
]
type_check = [
    "mypy==2.3.0",
    {include-group = "tests"}
]
spellcheck = [
    "codespell==2.4.3"
]
dev = [
    {include-group = "tests"},
    {include-group = "coverage"},
    {include-group = "linting"},
    {include-group = "type_check"},
    {include-group = "spellcheck"},
    "pre-commit"
]

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"



[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_generics_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
